<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="480">
      <stop offset="0%" stop-color="#060810"/>
      <stop offset="50%" stop-color="#141432"/>
      <stop offset="85%" stop-color="#2d1338"/>
      <stop offset="100%" stop-color="#541634"/>
    </linearGradient>
    <radialGradient id="sun" cx="75%" cy="30%" r="20%">
      <stop offset="0%" stop-color="#ff4d8b"/>
      <stop offset="60%" stop-color="#e82127"/>
      <stop offset="100%" stop-color="rgba(232, 33, 39, 0)"/>
    </radialGradient>
    <linearGradient id="roadsterRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff474d"/>
      <stop offset="50%" stop-color="#e82127"/>
      <stop offset="100%" stop-color="#7a080d"/>
    </linearGradient>
    <linearGradient id="thrusterBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="30%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="480" fill="url(#sky)"/>
  
  <!-- Cyber Sun -->
  <circle cx="900" cy="180" r="100" fill="url(#sun)"/>

  <!-- City Skyline -->
  <rect x="50" y="240" width="80" height="240" fill="#111422"/>
  <rect x="150" y="190" width="110" height="290" fill="#171c2c"/>
  <rect x="290" y="270" width="90" height="210" fill="#111422"/>
  <rect x="420" y="160" width="140" height="320" fill="#1a2033"/>
  <rect x="600" y="220" width="120" height="260" fill="#131724"/>
  <rect x="750" y="180" width="130" height="300" fill="#1c2238"/>
  <rect x="910" y="250" width="110" height="230" fill="#111422"/>
  <rect x="1050" y="200" width="100" height="280" fill="#181e30"/>

  <!-- Highway -->
  <rect y="480" width="1200" height="150" fill="#13151f"/>
  <line x1="0" y1="480" x2="1200" y2="480" stroke="#00d2ff" stroke-width="4"/>
  <line x1="0" y1="540" x2="1200" y2="540" stroke="#ffde59" stroke-width="6" stroke-dasharray="60 40"/>

  <!-- Stuck Traffic on the Road -->
  <!-- Yellow Taxi -->
  <rect x="580" y="475" width="110" height="40" rx="6" fill="#ffbe0b"/>
  <rect x="620" y="465" width="30" height="10" fill="#ffbe0b"/>
  <circle cx="610" cy="515" r="14" fill="#111"/>
  <circle cx="660" cy="515" r="14" fill="#111"/>

  <!-- Blue Truck -->
  <rect x="730" y="440" width="180" height="75" fill="#2b2d42"/>
  <rect x="880" y="460" width="50" height="55" fill="#3a86ff"/>
  <circle cx="760" cy="515" r="14" fill="#111"/>
  <circle cx="830" cy="515" r="14" fill="#111"/>
  <circle cx="910" cy="515" r="14" fill="#111"/>

  <!-- Cybertruck -->
  <polygon points="980,515 995,475 1040,455 1090,470 1110,515" fill="#b0b8c2"/>
  <circle cx="1010" cy="515" r="14" fill="#111"/>
  <circle cx="1080" cy="515" r="14" fill="#111"/>

  <!-- Flying Tesla Roadster with SpaceX Thrusters -->
  <g transform="translate(320, 320) rotate(-12)">
    <!-- Rocket Thruster Blast -->
    <polygon points="-80,10 -20,-2 -20,22" fill="url(#thrusterBeam)"/>
    <ellipse cx="-80" cy="10" rx="30" ry="12" fill="#00d2ff" opacity="0.6"/>
    
    <!-- Roadster Car Silhouette -->
    <path d="M -60,20 L -55,5 L -30,-5 L -10,-24 L 30,-24 L 65,0 L 105,5 L 120,20 Z" fill="url(#roadsterRed)"/>
    <!-- Canopy Glass -->
    <path d="M -25,-4 L -8,-20 L 25,-20 L 55,-2 Z" fill="#0b111e"/>
    <!-- LED Headlight -->
    <polygon points="105,7 122,12 110,14" fill="#ffffff"/>
    <!-- Red Taillight -->
    <rect x="-60" y="5" width="4" height="12" fill="#ff2233"/>
    <!-- Wheels -->
    <circle cx="-30" cy="22" r="15" fill="#111" stroke="#333" stroke-width="2"/>
    <circle cx="75" cy="22" r="15" fill="#111" stroke="#333" stroke-width="2"/>
    <!-- RCS Attitude Thruster Burst Front -->
    <polygon points="80,-5 85,-18 75,-18" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Title / Branding Typography -->
  <rect x="50" y="45" width="180" height="30" rx="6" fill="#e82127"/>
  <text x="140" y="66" fill="#ffffff" font-family="'Orbitron', sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="3">TESLA MOTORS</text>

  <text x="50" y="130" fill="#ffffff" font-family="'Orbitron', sans-serif" font-weight="900" font-size="52" letter-spacing="4">ROADSTER</text>
  <text x="50" y="175" fill="#00d2ff" font-family="'Orbitron', sans-serif" font-weight="900" font-size="34" letter-spacing="6">FLIGHT MODE</text>
  <text x="50" y="210" fill="#cbd5e1" font-family="'Rajdhani', sans-serif" font-weight="600" font-size="20">0 to 60 in 1.1s — Why sit in traffic when you can fly over it?</text>

  <rect x="50" y="230" width="340" height="32" rx="4" fill="rgba(0, 210, 255, 0.15)" stroke="#00d2ff" stroke-width="1"/>
  <text x="65" y="252" fill="#00d2ff" font-family="'Orbitron', sans-serif" font-weight="700" font-size="12" letter-spacing="2">🚀 SPACEX COLD GAS THRUSTER READY</text>
</svg>
